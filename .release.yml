# .release.yml — Klausi-Release-Konvention Meta
# Generated by klausi-release skill v1.1.2 (stack: rails)
# To update:    cd <repo> && /release sync
#
# Bei Variante D1 (Inline-Logik): diese Datei ist primär Doku + Skill-Meta.
# Die echte Validierungs-Logik lebt in .github/workflows/release.yml.

schema-version: 1
stack: rails
skill-version-current: 1.1.3   # wird beim nächsten /release sync aktualisiert

changelog:
  path: CHANGELOG.md
  format: keep-a-changelog

# Dokumentation der Versions-Stellen — Rails-Default ist VERSION-Datei + CHANGELOG.
# VERSION ist eine 1-Zeilen-Datei im Repo-Root mit dem reinen Versions-String.
documented-version-locations:
  - VERSION (1-line file at repo root, e.g. "0.1.0\n")
  - "CHANGELOG.md (heading + compare-link, validated)"
  - "README.md (shields.io badge: version-X.Y.Z-blue)"

# Versions-Stellen für `/release prepare` (ausführungsrelevant).
# Rails-Default ist VERSION-Datei (1-Zeile). Bei Gem-Repos zusätzlich version.rb.
bump-targets:
  - { file: VERSION, whole-file: true }
  - { file: README.md, regex: "version-([0-9]+\\.[0-9]+\\.[0-9]+)-blue" }
  # Optional ergaenzbar (z.B. bei Gem-Repos):
  # - { file: lib/<gem_name>/version.rb, regex: "VERSION\\s*=\\s*\"([0-9]+\\.[0-9]+\\.[0-9]+)\"" }

build:
  command: ""                    # Rails-Apps haben i.d.R. keinen Release-Build
  output-paths: []               # leer = kein Drift-Check
  drift-check: false

quality-gates:
  - { name: rubocop, command: "bundle exec rubocop" }
  - { name: test,    command: "bin/rails test" }
  # Optional ergaenzbar:
  # - { name: rspec,         command: "bundle exec rspec",                                                  required: true }
  - { name: brakeman,      command: "bundle exec brakeman --no-pager",                                    required: false }
  - { name: bundler-audit, command: "bundle exec bundle-audit check --update",                            required: false }

# Reserved for future Schema v2
post-release:
  issue-close-pattern: null
