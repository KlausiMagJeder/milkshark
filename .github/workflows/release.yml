# =============================================================================
# Generated by klausi-release skill v1.1.3
# To update:    cd <repo> && /release sync
# Repo-spec:    Edit only between REPO-SPECIFIC START / END markers below.
# Convention:   ~/RubymineProjects/Obsidian_Arbeit/Projecte/private/Release/
# Stack:        rails (Ruby on Rails app)
#
# WARUM dieser Workflow:
#   Automatisiert die in der Klausi-Release-Konvention beschriebenen Schritte +
#   GitHub-Release-Erstellung. Konsumenten-Repos bekommen die Logik inline (kein
#   Reusable-Workflow), damit das File ohne externes Dependency-Setup laeuft.
#
# Trigger:
#   - Tag-Push (vX.Y.Z[-suffix]): Auto-Release bei jedem semver-Tag.
#   - workflow_dispatch: Manuelle Ausloesung mit Tag-Input (z.B. fuer Re-Run
#     nach Workflow-Fix).
#
# Permissions:
#   contents: write fuer gh release create. Sonst Default (read).
#
# WICHTIG: Dieser Workflow erzeugt KEINEN Commit. Er validiert nur, dass der
#   bereits gepushte Working-Tree (am Tag-SHA) konsistent ist, und erstellt den
#   GitHub-Release.
#
# WARUM VERSION-Datei statt Gemfile.lock / version.rb / application.rb:
#   - Gemfile.lock: auto-generiert durch `bundle install`, Versions-Bump waere
#     Race-Condition-anfaellig (jede `bundle install`-Aenderung dreht den Lock).
#   - lib/<gem>/version.rb: Gem-Pattern (fuer Gems gedacht, nicht fuer Apps).
#   - config/application.rb: Rails-Config-File, App-Version dort waere semantisch
#     unsauber (mischt Framework- und App-Concerns).
#   - VERSION-Datei (1 Zeile, nur Versions-String): pragmatisch, ein einziger
#     Wert, leicht zu bumpen + zu verifizieren.
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0 or v1.0.0-rc.1)'
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Validate & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
    steps:
      # === SHARED: Checkout ===
      - name: Checkout (at tag SHA)
        uses: actions/checkout@v7
        with:
          # WARUM fetch-depth: 1:
          #   awk-CHANGELOG-Extraction liest CHANGELOG.md aus dem Working-Tree,
          #   NICHT aus git log — daher reicht eine flache Checkout-Tiefe.
          #   Bei workflow_dispatch resolved actions/checkout den Tag-Input via
          #   ref:-Parameter; das Tag-Objekt selbst wird vom Server geliefert,
          #   tiefe History ist nicht erforderlich. CI-Speedup.
          fetch-depth: 1
          ref: ${{ github.event.inputs.tag || github.ref }}

      # === SHARED: Tag-Schema-Validator (SemVer 2.0 + Pre-Release-Support) ===
      - name: Validate tag schema
        run: |
          # WARUM bei BEIDEN Trigger-Pfaden validieren:
          #   Tag-Push-Trigger (push.tags: ['v*.*.*']) filtert per Glob, aber das
          #   Glob ist lax (`v*.*.*` matched z.B. auch unerwuenschte Strings).
          #   workflow_dispatch akzeptiert ohnehin jeden String.
          # WARUM Pre-Release-Suffix erlaubt:
          #   Klausi-Konvention B.1 — SemVer 2.0 Pre-Release-Identifier
          #   (z.B. -rc.1, -beta.2) sind von Anfang an Teil der Konvention.
          #   Build-Metadaten (+BUILD) bewusst weggelassen (irrelevant).
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must match SemVer 2.0 (vX.Y.Z[-suffix]), got: $TAG" >&2
            exit 1
          fi

      # === SHARED: Resolve tag, version, pre-release flag ===
      - name: Resolve tag and detect pre-release
        id: ver
        run: |
          # WARUM POSIX-Shell mit set -euo pipefail:
          #   ubuntu-latest hat bash, aber set -euo pipefail + portable cuts
          #   halten das Skript reproduzierbar.
          # WARUM Pre-Release-Detection per "-"-Match:
          #   SemVer 2.0 Spec: alles nach dem ersten "-" im VERSION-String ist
          #   Pre-Release-Identifier. Klausi-Konvention B.3 — Pre-Releases
          #   muessen sich vom Latest-Marker selbst ausnehmen.
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Strip v-Prefix: v0.6.0 -> 0.6.0, v1.0.0-rc.1 -> 1.0.0-rc.1
          VERSION="${TAG#v}"
          if [[ "$TAG" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "tag=$TAG"                       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"               >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE"   >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG / Version: $VERSION / Pre-release: $IS_PRERELEASE"

      # === STACK-SPECIFIC: Runtime-Setup + Dependency-Install (rails) ===
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # WARUM bundler-cache: true:
          #   setup-ruby@v1 macht damit automatisch `bundle install` + Cache
          #   ueber actions/cache. Spart 1-3 min CI-Zeit pro Lauf.
          # WARUM .ruby-version statt fixe Version:
          #   Repos pflegen .ruby-version typischerweise (Klausi-Konvention).
          #   Wenn nicht: ergaenzen mit `ruby-version: 3.4` o.ae.
          bundler-cache: true

      # === REPO-SPECIFIC START: version-locations ===
      # Default fuer Rails-App: VERSION-Datei im Repo-Root (1 Zeile, nur "X.Y.Z").
      # Maintainer-Verantwortung: bei jedem Release VERSION + CHANGELOG aktualisieren.
      - name: Validate VERSION file
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.ver.outputs.version }}"
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file missing. Klausi-Rails-Convention requires a 1-line VERSION file at repo root."
            echo "::error::Quick-fix: echo '$EXPECTED' > VERSION && git add VERSION && git commit -m 'chore: add VERSION file'"
            exit 1
          fi
          VERSION_FILE=$(tr -d '\n\r ' < VERSION)
          if [ "$VERSION_FILE" != "$EXPECTED" ]; then
            echo "::error::VERSION file mismatch — expected $EXPECTED, found $VERSION_FILE"
            exit 1
          fi
          echo "VERSION file matches $EXPECTED."

      - name: Validate README badge version
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.ver.outputs.version }}"
          README=$(grep -oE 'version-[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?-blue' README.md | head -1 | sed 's/version-//;s/-blue//')
          if [ "$README" != "$EXPECTED" ]; then
            echo "::error::README badge version mismatch — expected $EXPECTED, found $README"
            exit 1
          fi
      # === REPO-SPECIFIC END: version-locations ===

      # === SHARED: CHANGELOG-Validators ===
      - name: Validate CHANGELOG entry exists
        run: |
          # WARUM 3 separate Pattern-Checks:
          #   Klausi-Konvention B.4 fordert (1) Versions-Heading mit Datum,
          #   (2) Unreleased-Heading muss erhalten bleiben, (3) Compare-Link
          #   am Dateiende. Drei Fail-Fast-Checks geben praezisere Fehler als
          #   ein zusammengesetzter Regex-Check.
          # WARUM releases/tag/v als Alternative zu compare/v:
          #   Das erste Release hat keinen Vorgaenger-Tag, also keinen
          #   Compare-Link. init.mjs schreibt dafuer releases/tag/v<version>.
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          if ! grep -qE "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing entry: '## [$VERSION] - <YYYY-MM-DD>'"
            exit 1
          fi
          if ! grep -qE "^## \[Unreleased\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing '## [Unreleased]' heading."
            exit 1
          fi
          if ! grep -qE "^\[$VERSION\]: https://github.com/.+/(compare|releases/tag)/v" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing link '[$VERSION]: https://github.com/.../compare/v...' (or .../releases/tag/v$VERSION for the first release)"
            exit 1
          fi
          echo "CHANGELOG.md OK for version $VERSION."

      # === STACK-SPECIFIC: Quality-Gates Lint (rails) ===
      - name: Lint (RuboCop)
        run: bundle exec rubocop

      # === REPO-SPECIFIC START: extra-pre-test-steps ===
      # Pre-Test-Hooks in Maintainer-Hoheit — laufen NACH Lint, VOR den Tests.
      # Typischer Use-Case: gebautes CSS (dartsass-rails/cssbundling schreiben nach
      # app/assets/builds/, das meist gitignored ist) fehlt sonst in CI und
      # view-rendernde Tests crashen mit "asset application.css not found".
      # Den passenden Build-Step hier aktivieren (Reihenfolge: Lint -> Build -> Test):
      #
      # - name: Build CSS assets
      #   run: bin/rails dartsass:build      # bzw. css:build / assets:precompile, je nach Setup
      # === REPO-SPECIFIC END: extra-pre-test-steps ===

      # === STACK-SPECIFIC: Quality-Gates Test (rails) ===
      - name: Test (Rails)
        # WARUM bin/rails test als Default:
        #   Rails 7+ Standard. Wenn das Repo RSpec nutzt:
        #   - diesen Step entfernen
        #   - im REPO-SPECIFIC: extra-quality-gates ein "bundle exec rspec"-Step ergaenzen
        run: bin/rails test

      # === REPO-SPECIFIC START: extra-quality-gates ===
      # Maintainer kann hier zusaetzliche Repo-spezifische Gates ergaenzen:
      #
      # Beispiel RSpec (wenn Repo RSpec statt Minitest nutzt):
      # - name: RSpec tests
      #   run: bundle exec rspec
      #
      # Beispiel Brakeman (Security-Scan, optional via required: false):
      # - name: Brakeman security scan
      #   run: bundle exec brakeman --no-pager
      #
      # Beispiel Bundler-Audit (Dependency-Vulnerability-Scan):
      # - name: Bundler-audit
      #   run: bundle exec bundle-audit check --update
      # === REPO-SPECIFIC END: extra-quality-gates ===

      # === REPO-SPECIFIC START: extra-build-steps ===
      # Falls das Repo Asset-Precompile fuer den Release braucht
      # (z.B. fuer dist/-Bundle-Vorbereitung): hier ergaenzen.
      #
      # Beispiel:
      # - name: Precompile assets
      #   run: bin/rails assets:precompile
      # === REPO-SPECIFIC END: extra-build-steps ===

      # === SHARED: CHANGELOG-Notes-Extraction ===
      - name: Extract CHANGELOG section for this version
        run: |
          # WARUM awk: POSIX-portabel, kein externer Dep. Extrahiert den Block
          # zwischen "## [<version>] - " und (a) der naechsten "## [" Heading ODER
          # (b) der ersten Comparison-Link-Definition am Datei-Ende
          # ([Unreleased]: ..., [X.Y.Z]: ...). Zweite Bedingung deckt den
          # End-of-File-Edge-Case ab (CHANGELOG endet ohne weitere "## [" Heading).
          # Liefert leer wenn nichts gefunden — Caller validiert.
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\] - " { capture=1; next }
            /^## \[/ && capture { exit }
            /^\[[0-9]/ && capture { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::Empty CHANGELOG section extracted for $VERSION."
            exit 1
          fi
          echo "Release notes preview:"
          cat /tmp/release-notes.md

      # === SHARED: GitHub-Release-Creation (Pre-Release-aware) ===
      - name: Create GitHub Release
        # WARUM SHA-Pin statt @v2:
        #   Supply-Chain-Hardening (Klausi-Konvention) — mutable Tags koennen
        #   vom Maintainer verschoben werden (oder bei Account-Compromise).
        #   SHA ist immutable und gibt reproduzierbare Builds. Tag-Version im
        #   Kommentar dahinter fuer menschliche Lesbarkeit / Renovate.
        # WARUM body_path statt body:
        #   Robuster gegen mehrzeilige Inhalte mit Sonderzeichen (Backticks,
        #   Dollarzeichen, eingebettete Heredocs). softprops/action-gh-release@v2
        #   liest body_path direkt und vermeidet GITHUB_OUTPUT-Delimiter-Fallen.
        # WARUM make_latest dynamisch:
        #   Klausi-Konvention B.3 — Pre-Release-Tags (vX.Y.Z-suffix) duerfen den
        #   `latest`-Marker nicht ueberschreiben. Nur finale Tags werden latest.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ steps.ver.outputs.is_prerelease }}
          make_latest: ${{ steps.ver.outputs.is_prerelease == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
